<!DOCTYPE html>
<html>
<head>
  <title>DWG Weather</title>

  <style>
    body {
      font-family: Arial;
      background: #0b1e2d;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: #132f45;
      padding: 15px;
      margin: 10px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h1>🌦️ DWG Weather App</h1>

<div id="status">Loading app...</div>

<div class="card" id="weatherBox">Weather loading...</div>
<div class="card" id="tempestBox">Tempest loading...</div>

<script>
console.log("APP START");

// API KEYS
const weatherKey = "1964e3c44abd01892f86bed9c6029932";
const tempestKey = "79cb290e-f774-4463-81bf-c87d9f82fc50";

// TEST UI LOAD FIRST
document.getElementById("status").innerText = "App loaded. Fetching data...";

// ---------------- WEATHER ----------------
fetch(`https://api.openweathermap.org/data/2.5/weather?q=Wilmington,DE,US&units=imperial&appid=${weatherKey}`)
.then(res => res.json())
.then(data => {

  console.log("Weather data:", data);

  if(!data.main){
    document.getElementById("weatherBox").innerText = "Weather failed to load";
    return;
  }

  document.getElementById("weatherBox").innerHTML = `
    <h3>Wilmington</h3>
    <p>${data.main.temp}°F</p>
    <p>${data.weather[0].description}</p>
  `;
})
.catch(err => {
  console.log("Weather ERROR:", err);
  document.getElementById("weatherBox").innerText = "Weather error";
});

// ---------------- TEMPEST ----------------
fetch(`https://swd.weatherflow.com/swd/rest/observations/station/75031?api_key=${tempestKey}`)
.then(res => res.json())
.then(data => {

  console.log("Tempest data:", data);

  const obs = data.obs?.[0];

  if(!obs){
    document.getElementById("tempestBox").innerText = "No Tempest data";
    return;
  }

  const tempF = (obs[7] * 9/5) + 32;

  document.getElementById("tempestBox").innerHTML = `
    <h3>Tempest Station</h3>
    <p>${tempF.toFixed(1)}°F</p>
  `;
})
.catch(err => {
  console.log("Tempest ERROR:", err);
  document.getElementById("tempestBox").innerText = "Tempest error";
});

</script>

</body>
</html>
