<script>
const weatherKey = "1964e3c44abd01892f86bed9c6029932";

// ---------------- STATUS ----------------
document.getElementById("status").innerText = "App loaded. Fetching data...";

// ---------------- WEATHER ----------------
fetch(`https://api.openweathermap.org/data/2.5/weather?q=Wilmington,DE,US&units=imperial&appid=${weatherKey}`)
.then(res => res.json())
.then(data => {

  console.log("Weather data:", data);

  if(!data.main){
    document.getElementById("weatherBox").innerText = "Weather failed to load";
    return;
  }

  document.getElementById("weatherBox").innerHTML = `
    <h3>Wilmington</h3>
    <p>${data.main.temp.toFixed(1)}°F</p>
    <p>${data.weather[0].description}</p>
  `;
})
.catch(err => {
  console.log("Weather ERROR:", err);
  document.getElementById("weatherBox").innerText = "Weather error";
});

// ---------------- TEMPEST (TEMP REMOVED) ----------------
document.getElementById("tempestBox").innerHTML = `
  <h3>Tempest Station</h3>
  <p>⚠️ Tempest data temporarily unavailable</p>
  <p>Fix in progress</p>
`;

</script>
